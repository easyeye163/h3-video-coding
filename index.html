<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>嵩口AI短剧项目 · 首页</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;line-height:1.6}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,#1a0f2e 0%,#0f0a1e 40%,#1c1f26 70%,#2a1a0f 100%);
    min-height:100vh;
  }
  .wrap{max-width:680px;width:100%}
  header{text-align:center;margin-bottom:32px}
  header h1{
    font-size:26px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#e8b04b,#a855f7,#06b6d4);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  header p{font-size:14px;color:#9b8ab8;margin-top:8px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:600px){.cards{grid-template-columns:1fr}}

  .card{
    display:block;text-decoration:none;border-radius:16px;overflow:hidden;
    border:1px solid rgba(255,255,255,.08);transition:transform .25s ease,box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(124,58,237,.25)}
  .card .thumb{height:120px;display:flex;align-items:center;justify-content:center;position:relative}
  .card-warm .thumb{background:linear-gradient(135deg,#b8551f,#e07b3f)}
  .card-dark .thumb{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
  .card .thumb span{font-size:40px}
  .card .info{padding:16px 14px;background:#16121f}
  .card .info h2{font-size:16px;font-weight:700;color:#e8e0f5;margin-bottom:4px}
  .card .info p{font-size:12px;color:#9b8ab8}
  .card .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:8px}
  .card-warm .tag{background:rgba(184,85,31,.15);color:#e07b3f}
  .card-dark .tag{background:rgba(124,58,237,.15);color:#a855f7}

  footer{text-align:center;margin-top:32px;font-size:12px;color:#4a3a60}
  footer a{color:#7c3aed;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>嵩口AI短剧项目</h1>
    <p>AI 短剧制作工作流 · MiniMax H3 + RunningHub + GitHub</p>
  </header>

  <div class="cards">
    <a class="card card-warm" href="songkou-dashboard.html">
      <div class="thumb"><span>🏯</span></div>
      <div class="info">
        <h2>嵩口宣传项目</h2>
        <p>20集文化宣传短剧 · 6集已完成</p>
        <span class="tag">暖色主题 · 进度看板</span>
      </div>
    </a>

    <a class="card card-dark" href="yaolu-dashboard.html">
      <div class="thumb"><span>⚔️</span></div>
      <div class="info">
        <h2>嵩口镇妖录</h2>
        <p>12集仙侠衍生IP · 规划中</p>
        <span class="tag">暗色主题 · 素材看板</span>
      </div>
    </a>
  </div>

  <footer>
    <p>仓库 · <a href="https://github.com/easyeye163/h3-video-coding">github.com/easyeye163/h3-video-coding</a></p>
  </footer>
</div>
</body>
</html>
